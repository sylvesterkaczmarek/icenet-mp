name: Validate PR 510 notebook

on:
  push:
    branches:
      - validation/pr510-notebook-20260910-473c

permissions:
  contents: read

jobs:
  notebook:
    if: github.repository == 'sylvesterkaczmarek/icenet-mp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 087dc93d88af8104241e7b977392451e42ad50cb
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - name: Install locked project and notebook execution tools
        run: |
          set -euo pipefail
          uv sync --frozen --no-default-groups
          uv pip install --python .venv/bin/python nbclient nbformat ipykernel
          mkdir -p "$RUNNER_TEMP/pr510-validation"
          uv pip freeze --python .venv/bin/python > "$RUNNER_TEMP/pr510-validation/environment.txt"
      - name: Execute original notebook cells and verify generated artifacts
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          .venv/bin/python -u - <<'PY'
          import hashlib
          import json
          import math
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          import nbformat
          import yaml
          from nbclient import NotebookClient
          from jupyter_client.kernelspec import KernelSpecManager

          expected = '087dc93d88af8104241e7b977392451e42ad50cb'
          root = Path.cwd()
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected, (actual, expected)
          destination = Path(os.environ['RUNNER_TEMP']) / 'pr510-validation'
          destination.mkdir(exist_ok=True)
          home = destination / 'empty-home'
          home.mkdir()
          os.environ['HOME'] = str(home)
          os.environ['XDG_CONFIG_HOME'] = str(home / '.config')
          os.environ['XDG_CACHE_HOME'] = str(home / '.cache')
          for name in list(os.environ):
              if name.startswith(('WANDB_', 'CDSAPI_', 'ECMWF_API_', 'COPERNICUSMARINE_')):
                  os.environ.pop(name)
          analytics = home / '.config/anemoi/analytics.json'
          analytics.parent.mkdir(parents=True)
          analytics.write_text('{"enabled": false}\n')
          source = root / 'notebooks/demo_pipeline.ipynb'
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          assert not (root / 'base').exists(), 'Validation requires a fresh data/output root'
          notebook = nbformat.read(source, as_version=4)
          originals = [cell for cell in notebook.cells if cell.cell_type == 'code']
          assert len(originals) == 24, len(originals)
          # Keep repository sources unchanged. Check each shell command's exit status
          # in the executed copy, since IPython otherwise permits failed commands.
          shell_cells = 0
          for cell in originals:
              if any(line.lstrip().startswith('!') for line in cell.source.splitlines()):
                  shell_cells += 1
                  cell.source += '\nassert get_ipython().user_ns.get("_exit_code") == 0, "CLI command failed or exit status absent"\n'
          spec_dir = destination / 'kernel-source'
          spec_dir.mkdir()
          (spec_dir / 'kernel.json').write_text(json.dumps({
              'argv': [sys.executable, '-m', 'ipykernel_launcher', '-f', '{connection_file}'],
              'display_name': 'PR 510 validation', 'language': 'python'
          }))
          KernelSpecManager().install_kernel_spec(str(spec_dir), kernel_name='pr510-validation', user=True)
          client = NotebookClient(notebook, timeout=300, kernel_name='pr510-validation',
                                  resources={'metadata': {'path': str(root / 'notebooks')}})
          client.on_cell_start = lambda cell, cell_index, **kwargs: print('CELL', cell_index, cell.cell_type, flush=True)
          summary = {'head_sha': actual, 'notebook_sha256': digest, 'original_code_cells': len(originals),
                     'fresh_home': True, 'fresh_data_root': True, 'shell_exit_checks': shell_cells, 'success': False}
          try:
              client.execute()
              code_cells = [c for c in notebook.cells if c.cell_type == 'code']
              errors = [o for c in code_cells for o in c.get('outputs', []) if o.output_type == 'error']
              summary.update(executed_code_cells=sum(c.execution_count is not None for c in code_cells), errors=len(errors))
              assert not errors, errors
              assert summary['executed_code_cells'] == 24
              # Persistence's relative checkpoint path can be nested within its run.
              # Match artifacts from actual top-level run/config directories rather
              # than assuming that every checkpoint is one directory below its config.
              runs_root = root / 'base/training/local'
              configs = sorted(runs_root.glob('*/files/model_config.yaml'))
              assert len(configs) >= 2, 'Both learned and persistence run configs are required'
              artifacts = []
              for config_path in configs:
                  run_dir = config_path.parent.parent
                  checkpoints = sorted(run_dir.glob('**/checkpoints/*.ckpt'))
                  assert checkpoints, f'No checkpoint for {run_dir}'
                  assert all(p.stat().st_size > 0 for p in checkpoints)
                  config = yaml.safe_load(config_path.read_text())
                  artifacts.append({'run': str(run_dir.relative_to(root)),
                                    'model_target': config['model']['_target_'],
                                    'model_name': config['model']['name'],
                                    'checkpoints': [str(p.relative_to(root)) for p in checkpoints]})
                  shutil.copyfile(config_path, destination / (run_dir.name + '-model_config.yaml'))
              targets = {a['model_target'] for a in artifacts}
              assert any('Persistence' in target for target in targets), targets
              assert any('EncodeProcessDecode' in target for target in targets), targets
              metrics_path = root / 'base/report/metrics.jsonl'
              assert metrics_path.is_file(), 'Evaluation metrics file is missing'
              rows = [json.loads(line) for line in metrics_path.read_text().splitlines() if line.strip()]
              test_losses = [row['test_loss'] for row in rows if 'test_loss' in row]
              assert test_losses and all(math.isfinite(value) for value in test_losses), test_losses
              shutil.copyfile(metrics_path, destination / 'metrics.jsonl')
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest
              subprocess.run(['git', 'diff', '--exit-code'], check=True)
              summary.update(success=True, training_runs=artifacts, recorded_test_losses=test_losses,
                             original_notebook_unchanged=True)
          finally:
              nbformat.write(notebook, destination / 'demo_pipeline.executed.ipynb')
              (destination / 'summary.json').write_text(json.dumps(summary, indent=2))
              print(json.dumps(summary, indent=2), flush=True)
          PY
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr510-notebook-087dc93d
          path: |
            ${{ runner.temp }}/pr510-validation/summary.json
            ${{ runner.temp }}/pr510-validation/environment.txt
            ${{ runner.temp }}/pr510-validation/demo_pipeline.executed.ipynb
            ${{ runner.temp }}/pr510-validation/*-model_config.yaml
            ${{ runner.temp }}/pr510-validation/metrics.jsonl
          retention-days: 14
          if-no-files-found: warn
