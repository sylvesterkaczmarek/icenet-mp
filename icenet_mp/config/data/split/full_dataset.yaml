batch_size: 2

# This data is reserved for future prediction without labels.
# Data from 2025 (1 year)
predict:
  - start: 2025-01-01
    end: 2025-12-31

# These are unseen paper holdout years and must not be used for training/validation.
# Data from 2013 and 2023 (2 years)
test:
  - start: 2013-01-01
    end: 2013-12-31
  - start: 2023-01-01
    end: 2023-12-31

# This data is used for training the model.
# Excludes the 2013/2023 paper holdouts, 2019 validation year, and 2025 prediction year.
train:
  - start: null
    end: 2012-12-31
  - start: 2014-01-01
    end: 2018-12-31
  - start: 2020-01-01
    end: 2022-12-31
  - start: 2024-01-01
    end: 2024-12-31

# This data is used for validation/leaderboard comparison during model development.
# Data from 2019 (1 year)
validate:
  - start: 2019-01-01
    end: 2019-12-31
